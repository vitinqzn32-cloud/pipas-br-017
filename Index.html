<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIPAS BR 017 - ULTIMATE EDITION</title>
    <style>
        :root { --neon: #00f2ff; --money: #2ecc71; --gold: #f1c40f; --police: #ff0033; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, sans-serif; color: white; }
        
        /* TELA DE INTRO */
        #intro { position: fixed; inset: 0; background: black; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: 1s; }
        .logo-anim { font-size: 40px; font-weight: 900; letter-spacing: 10px; color: var(--neon); text-shadow: 0 0 20px var(--neon); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.05); } }

        /* HUD E INTERFACE */
        #hud { position: fixed; top: 10px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 100; display: none; }
        .card { background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 5px; border-bottom: 3px solid var(--neon); font-weight: bold; }
        .money { color: var(--money); }

        /* RADAR */
        #radar { position: fixed; bottom: 20px; left: 20px; width: 120px; height: 120px; border: 2px solid var(--neon); border-radius: 50%; background: rgba(0,255,255,0.05); display: none; }
        #player-dot { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }

        /* BOTÃO DE TRAMPO */
        #job-btn { position: fixed; bottom: 30px; right: 30px; padding: 15px 30px; background: var(--money); border: none; border-radius: 50px; color: black; font-weight: 900; cursor: pointer; display: none; }
        
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="intro">
        <div class="logo-anim">PIPAS BR 017</div>
        <p style="margin-top: 20px; color: #555;">POWERED BY GEMINI TOP 1 IA</p>
        <button onclick="startGame()" style="margin-top: 50px; padding: 15px 40px; background: none; border: 2px solid var(--neon); color: var(--neon); font-weight: bold; cursor: pointer;">INICIAR JOGO</button>
    </div>

    <div id="hud">
        <div class="card">CARTEIRA: <span class="money">$ <span id="val-money">50.00</span></span></div>
        <div class="card">CORTES: <span id="val-cuts">0</span></div>
        <div class="card" id="rank-tag">RANK: NOVATO</div>
    </div>

    <button id="job-btn" onclick="doJob()">ENTREGAR (+$25)</button>

    <div id="radar"><div id="player-dot"></div><div id="police-dot"></div></div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let money = 50.0;
    let cuts = 0;
    let playing = false;
    let time = 0;

    function startGame() {
        document.getElementById('intro').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('radar').style.display = 'block';
            document.getElementById('job-btn').style.display = 'block';
            playing = true;
        }, 1000);
    }

    function doJob() {
        const btn = document.getElementById('job-btn');
        btn.disabled = true;
        btn.innerText = "ENTREGANDO...";
        setTimeout(() => {
            money += 25.50;
            document.getElementById('val-money').innerText = money.toFixed(2);
            btn.disabled = false;
            btn.innerText = "ENTREGAR (+$25)";
        }, 3000);
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    // Loop do Motor Gráfico
    function loop() {
        if (!playing) return requestAnimationFrame(loop);
        time += 0.02;
        ctx.clearRect(0,0,canvas.width, canvas.height);

        // Céu Realista (Gradiente)
        let sky = ctx.createLinearGradient(0,0,0, canvas.height);
        sky.addColorStop(0, '#000814');
        sky.addColorStop(1, '#001d3d');
        ctx.fillStyle = sky;
        ctx.fillRect(0,0,canvas.width, canvas.height);

        // Desenho da Pipa do Jogador (Com rabiola e brilho)
        drawPipa(canvas.width/2, canvas.height/2 + Math.sin(time)*30, "var(--neon)");

        // Simulação de Polícia de Bike no Radar
        let px = 60 + Math.sin(time*0.5)*40;
        let py = 60 + Math.cos(time*0.5)*40;
        document.getElementById('police-dot').style = `position:absolute; left:${px}px; top:${py}px; width:6px; height:6px; background:red; border-radius:50%; box-shadow: 0 0 10px red;`;

        requestAnimationFrame(loop);
    }

    function drawPipa(x, y, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(time)*0.1);
        
        // Sombra/Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = "cyan";

        // Losango da Pipa
        ctx.beginPath();
        ctx.moveTo(0, -50); ctx.lineTo(40, 0); ctx.lineTo(0, 60); ctx.lineTo(-40, 0);
        ctx.closePath();
        ctx.fillStyle = "rgba(0, 242, 255, 0.8)";
        ctx.fill();
        ctx.strokeStyle = "white";
        ctx.stroke();

        // Linha e Rabiola
        ctx.beginPath();
        ctx.moveTo(0, 60);
        for(let i=0; i<10; i++) {
            ctx.lineTo(Math.sin(time+i)*10, 60 + i*15);
        }
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.stroke();
        
        ctx.restore();
    }

    loop();
</script>
</body>
</html>
