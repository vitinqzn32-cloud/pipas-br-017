<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIPAS BR 017 - V1.0</title>
    <style>
        :root { --neon: #00f2ff; --money: #2ecc71; --danger: #ff0033; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; color: white; touch-action: none; }
        
        /* TELAS */
        #intro, #shop-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #shop-ui { display: none; background: rgba(0,10,20,0.95); }

        /* HUD */
        #hud { position: fixed; top: 10px; width: 100%; display: flex; justify-content: space-around; z-index: 100; display: none; pointer-events: none; }
        .card { background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; border: 1px solid var(--neon); font-weight: bold; font-size: 14px; }

        /* CONTROLES */
        #controls { position: fixed; bottom: 20px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .btn-game { padding: 15px 25px; background: rgba(0,242,255,0.2); border: 2px solid var(--neon); color: var(--neon); border-radius: 10px; font-weight: bold; pointer-events: auto; }
        
        canvas { display: block; }
        .btn-main { padding: 15px 40px; background: var(--neon); border: none; color: black; font-weight: 900; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="intro">
        <h1 style="color:var(--neon); text-shadow: 0 0 20px var(--neon);">PIPAS BR 017</h1>
        <button class="btn-main" onclick="start()">JOGAR AGORA</button>
    </div>

    <div id="shop-ui">
        <h2>LOJA DA QUEBRADA</h2>
        <div style="margin: 20px; text-align: center;">
            <p>LINHA CHILENA - $100</p>
            <button class="btn-game" onclick="buy('chilena')">COMPRAR</button>
        </div>
        <button class="btn-main" onclick="closeShop()">VOLTAR</button>
    </div>

    <div id="hud">
        <div class="card">CARTEIRA: <span style="color:var(--money)">$ <span id="m-val">50.00</span></span></div>
        <div class="card">RANK: <span id="r-val">NOVATO</span></div>
    </div>

    <div id="controls">
        <button class="btn-game" id="job-btn" onclick="doWork()">FAZER ENTREGA (+$20)</button>
        <button class="btn-game" onclick="openShop()">LOJA</button>
    </div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let money = 50.0;
    let playing = false;
    let pX, pY;
    let targetX;

    function start() {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('controls').style.display = 'flex';
        pX = canvas.width / 2;
        pY = canvas.height / 2;
        targetX = pX;
        playing = true;
    }

    function doWork() {
        const btn = document.getElementById('job-btn');
        btn.innerText = "ENTREGANDO...";
        btn.disabled = true;
        setTimeout(() => {
            money += 20;
            document.getElementById('m-val').innerText = money.toFixed(2);
            btn.innerText = "FAZER ENTREGA (+$20)";
            btn.disabled = false;
        }, 2000);
    }

    function openShop() { document.getElementById('shop-ui').style.display = 'flex'; }
    function closeShop() { document.getElementById('shop-ui').style.display = 'none'; }

    // Movimentação por toque
    window.addEventListener('touchstart', (e) => {
        if(!playing) return;
        targetX = e.touches[0].clientX;
    });

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    function drawPipa(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // Desenho da Pipa
        ctx.beginPath();
        ctx.moveTo(0, -40); ctx.lineTo(30, 0); ctx.lineTo(0, 45); ctx.lineTo(-30, 0);
        ctx.closePath();
        ctx.fillStyle = "cyan";
        ctx.shadowBlur = 15; ctx.shadowColor = "cyan";
        ctx.fill();
        // Rabiola
        ctx.beginPath();
        ctx.moveTo(0, 45);
        for(let i=1; i<6; i++) ctx.lineTo(Math.sin(Date.now()*0.01+i)*10, 45 + i*15);
        ctx.strokeStyle = "white"; ctx.stroke();
        ctx.restore();
    }

    function loop() {
        if(playing) {
            ctx.fillStyle = '#00050a';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            
            // Suavizar movimento
            pX += (targetX - pX) * 0.1;
            pY = (canvas.height/2) + Math.sin(Date.now()*0.002) * 20;

            drawPipa(pX, pY);
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
