<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIPAS BR 017 - NEXT GEN</title>
    <style>
        :root { --neon: #00f2ff; --money: #2ecc71; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        
        /* CAMADA DE FUNDO (CIDADE REAL) */
        #bg-image {
            position: fixed; inset: 0;
            background-image: url('https://images.unsplash.com/photo-1590424607733-4f9687989931?q=80&w=2000'); 
            background-size: cover; background-position: center;
            filter: brightness(0.4) contrast(1.2); z-index: -1;
        }

        /* INTERFACE (HUD) */
        #hud {
            position: fixed; top: 15px; width: 100%;
            display: flex; justify-content: space-around; z-index: 100;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--neon);
            padding: 10px 20px; border-radius: 12px;
            color: white; box-shadow: 0 0 15px var(--neon);
        }

        /* TELA DE LOADING */
        #overlay {
            position: fixed; inset: 0; background: black;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: var(--neon);
        }

        #game-canvas { display: block; }
        
        /* BOTÃO DE TRAMPO */
        #work-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: var(--money); border: none;
            border-radius: 50px; font-weight: 900; font-size: 18px;
            box-shadow: 0 0 20px var(--money); cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>

    <div id="overlay">
        <h1 style="font-size: 50px; text-shadow: 0 0 30px cyan;">017 ULTIMATE</h1>
        <p>CARREGANDO GRÁFICOS ULTRA...</p>
        <button onclick="start()" style="padding: 10px 30px; background: cyan; border: none; font-weight: bold;">ENTRAR NA FAVELA</button>
    </div>

    <div id="hud" style="display: none;">
        <div class="stat-card">GRANA: <span style="color:var(--money)">$ <span id="money-txt">50.00</span></span></div>
        <div class="stat-card">RANK: <span style="color:gold">MESTRE</span></div>
    </div>

    <button id="work-btn" style="display: none;" onclick="delivery()">FAZER ENTREGA (+$50)</button>

    <canvas id="game-canvas"></canvas>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let money = 50.0;
    let playing = false;
    let pipaImg = new Image();
    pipaImg.src = 'https://cdn-icons-png.flaticon.com/512/577/577051.png'; // Pipa Realista

    function start() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('work-btn').style.display = 'block';
        playing = true;
        resize();
    }

    function delivery() {
        money += 50.0;
        document.getElementById('money-txt').innerText = money.toFixed(2);
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    let mouseX = window.innerWidth / 2;
    window.addEventListener('mousemove', (e) => mouseX = e.clientX);
    window.addEventListener('touchmove', (e) => mouseX = e.touches[0].clientX);

    function draw() {
        if (playing) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let time = Date.now() * 0.002;
            let pipaX = mouseX;
            let pipaY = (canvas.height * 0.4) + Math.sin(time) * 30;

            // Desenhar Linha de Cerol com Brilho
            ctx.beginPath();
            ctx.moveTo(pipaX, pipaY);
            ctx.lineTo(canvas.width / 2, canvas.height + 100);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 1;
            ctx.stroke();

            // Desenhar Pipa (Imagem Real com Glow)
            ctx.save();
            ctx.shadowBlur = 30;
            ctx.shadowColor = "cyan";
            ctx.translate(pipaX, pipaY);
            ctx.rotate(Math.sin(time * 0.5) * 0.15);
            ctx.drawImage(pipaImg, -50, -50, 100, 100);
            
            // Rabiola Realista
            ctx.beginPath();
            ctx.moveTo(0, 50);
            for(let i=0; i<10; i++) {
                ctx.lineTo(Math.sin(time*2+i)*15, 50 + (i*25));
            }
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
