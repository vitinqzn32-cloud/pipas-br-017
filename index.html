<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIPAS BR 017 - NEXT GEN</title>
    <style>
        :root { --neon: #00f2ff; --money: #2ecc71; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        
        /* FUNDO REALISTA (COMUNIDADE) */
        #bg {
            position: fixed; inset: 0;
            background: url('https://images.unsplash.com/photo-1590424607733-4f9687989931?q=80&w=2000') center/cover;
            filter: brightness(0.3) contrast(1.2); z-index: -1;
        }

        /* HUD DE ELITE */
        #hud { position: fixed; top: 15px; width: 100%; display: flex; justify-content: space-around; z-index: 100; display: none; }
        .card { background: rgba(0,0,0,0.8); border: 2px solid var(--neon); padding: 10px 20px; border-radius: 12px; color: white; box-shadow: 0 0 15px var(--neon); }

        /* TELA DE INÍCIO */
        #start-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: var(--neon); }
        .btn-play { padding: 20px 50px; background: var(--neon); border: none; font-weight: 900; font-size: 20px; border-radius: 10px; cursor: pointer; color: black; box-shadow: 0 0 30px var(--neon); }

        /* BOTÃO DE TRAMPO */
        #work-btn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 40px; background: var(--money); border: none; border-radius: 50px; font-weight: 900; box-shadow: 0 0 20px var(--money); display: none; color: white; }
        
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="bg"></div>

    <div id="start-screen">
        <h1 style="font-size: 50px; text-shadow: 0 0 30px cyan;">017 ULTIMATE</h1>
        <p style="color: gold; margin-bottom: 30px;">VERSÃO 2026 - GRAFICOS ALTOS</p>
        <button class="btn-play" onclick="start()">ENTRAR NA QUEBRADA</button>
    </div>

    <div id="hud">
        <div class="card">CASH: <span style="color:var(--money)">$ <span id="m-val">50.00</span></span></div>
        <div class="card">RANK: <span style="color:gold">MESTRE</span></div>
    </div>

    <button id="work-btn" onclick="delivery()">FAZER ENTREGA (+$50)</button>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let money = 50.0, playing = false;
    let pipaImg = new Image();
    pipaImg.src = 'https://i.imgur.com/vH9Z2zE.png'; // Pipa de Combate Realista

    function start() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('work-btn').style.display = 'block';
        playing = true;
    }

    function delivery() {
        money += 50;
        document.getElementById('m-val').innerText = money.toFixed(2);
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    let pX = window.innerWidth / 2;
    window.addEventListener('touchmove', (e) => { if(playing) pX = e.touches[0].clientX; });
    window.addEventListener('mousemove', (e) => { if(playing) pX = e.clientX; });

    function loop() {
        if(playing) {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            let time = Date.now() * 0.002;
            let pY = (canvas.height * 0.4) + Math.sin(time)*30;

            // Linha com Brilho
            ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(canvas.width/2, canvas.height + 50);
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();

            // Pipa com Sombra e Glow
            ctx.save();
            ctx.translate(pX, pY);
            ctx.rotate(Math.sin(time*0.5)*0.15);
            ctx.shadowBlur = 30; ctx.shadowColor = "cyan";
            ctx.drawImage(pipaImg, -40, -40, 80, 80);
            
            // Rabiola
            ctx.beginPath(); ctx.moveTo(0, 40);
            for(let i=0; i<10; i++) ctx.lineTo(Math.sin(time*2+i)*10, 40 + i*20);
            ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
