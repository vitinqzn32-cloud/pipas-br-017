<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIPAS BR 017 - REALISTIC</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Impact', sans-serif; }
        
        /* O CENÁRIO QUE VOCÊ QUERIA */
        #favela-bg {
            position: fixed; inset: 0;
            background: url('https://w0.peakpx.com/wallpaper/101/952/HD-wallpaper-favela-rio-de-janeiro-slums-brazil.jpg') center/cover;
            filter: brightness(0.5) contrast(1.2); z-index: -1;
        }

        #hud {
            position: fixed; top: 10px; width: 100%; display: flex;
            justify-content: space-around; z-index: 100;
        }
        .info {
            background: rgba(0,0,0,0.8); color: #00f2ff;
            padding: 10px; border-radius: 5px; border-bottom: 3px solid #00f2ff;
            text-shadow: 0 0 10px cyan;
        }

        #work-btn {
            position: fixed; bottom: 20px; right: 20px;
            padding: 20px; background: #2ecc71; color: white;
            border: none; border-radius: 50%; font-weight: bold;
            box-shadow: 0 0 20px #2ecc71;
        }

        canvas { display: block; cursor: none; }
    </style>
</head>
<body>

    <div id="favela-bg"></div>

    <div id="hud">
        <div class="info">MONEY: $ <span id="cash">50</span></div>
        <div class="info">RANK: RELO MASTER</div>
    </div>

    <button id="work-btn" onclick="addMoney()">$</button>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let money = 50;
    
    // CARREGANDO A PIPA REAL
    const pipa = new Image();
    pipa.src = 'https://i.imgur.com/GisLhB2.png'; // Pipa Realista PNG

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize; resize();

    let pX = canvas.width/2;
    let pY = canvas.height/2;

    window.addEventListener('touchmove', (e) => {
        pX = e.touches[0].clientX;
        pY = e.touches[0].clientY - 100;
    });

    function addMoney() {
        money += 20;
        document.getElementById('cash').innerText = money;
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let time = Date.now() * 0.005;
        let wobble = Math.sin(time) * 15;

        // LINHA DE CEROL BRANCA
        ctx.beginPath();
        ctx.moveTo(pX, pY + wobble);
        ctx.lineTo(canvas.width/2, canvas.height + 50);
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // DESENHANDO A PIPA
        ctx.save();
        ctx.translate(pX, pY + wobble);
        ctx.rotate(Math.sin(time*0.5) * 0.1);
        
        // Se a imagem carregar, usa ela. Se não, usa o motor gráfico reserva.
        if(pipa.complete) {
            ctx.shadowBlur = 20; ctx.shadowColor = "cyan";
            ctx.drawImage(pipa, -60, -60, 120, 120);
        } else {
            // Desenho de Pipa Profissional em Vetor
            ctx.fillStyle = "cyan";
            ctx.beginPath();
            ctx.moveTo(0, -50); ctx.lineTo(40, 0); ctx.lineTo(0, 60); ctx.lineTo(-40, 0);
            ctx.fill();
        }

        // RABIOLA COMPRIDA
        ctx.beginPath();
        ctx.moveTo(0, 60);
        for(let i=0; i<15; i++) {
            ctx.lineTo(Math.sin(time + i*0.5)*20, 60 + (i*20));
        }
        ctx.strokeStyle = "white"; ctx.stroke();
        ctx.restore();

        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
